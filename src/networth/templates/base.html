<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Net Worth{% endblock %}</title>
<script>{{ THEME_INIT_JS | safe }}</script>
<style>{{ THEME_CSS | safe }}</style>
<link rel="stylesheet" href="{{ root }}/static/style.css?v={{ STYLE_VERSION }}">
</head>
<body>
{% block toolbar %}{{ toolbar | safe }}{% endblock %}
<main class="{% block main_class %}{% endblock %}">
{% for flash in flashes %}
<div class="flash {{ flash.kind }}{% if flash.action %} has-action{% endif %}" role="{{ 'alert' if flash.kind == 'error' else 'status' }}">
  <span class="flash-text">{{ flash.message }}</span>
  {% if flash.action %}<form method="post" action="{{ root }}{{ flash.action }}" class="inline">
    <button type="submit" class="small">{{ flash.label }}</button></form>{% endif %}
  <button type="button" class="flash-close" aria-label="Meldung schließen">×</button>
</div>
{% endfor %}
{% block content %}{% endblock %}
</main>
<script>{{ THEME_SWITCH_JS | safe }}</script>
<script>
// messages: close button; plain confirmations fade out on their own, errors and undo offers stay
document.querySelectorAll(".flash").forEach(flash => {
  const close = () => { flash.classList.add("closing"); setTimeout(() => flash.remove(), 250); };
  flash.querySelector(".flash-close").addEventListener("click", close);
  if (!flash.classList.contains("error") && !flash.classList.contains("has-action")) setTimeout(close, 6000);
});
</script>
{% if user and auth_enabled %}
<script>
// all tabs share the login: tie forms to the user this page was rendered for, reload if someone else logged in
(() => {
  const uid = "{{ user.id }}";
  for (const form of document.querySelectorAll("form[method=post]")) {
    const input = document.createElement("input");
    input.type = "hidden"; input.name = "as_user"; input.value = uid;
    form.appendChild(input);
  }
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState !== "visible") return;
    try {
      const response = await fetch("{{ root }}/whoami", {headers: {accept: "application/json"}});
      const current = response.ok ? String((await response.json()).id) : null;
      if (current !== uid) location.reload();
    } catch (e) { /* offline: keep the page */ }
  });
})();
</script>
{% endif %}
{% block scripts %}{% endblock %}
</body>
</html>
