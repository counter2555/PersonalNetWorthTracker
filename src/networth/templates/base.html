<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Net Worth{% endblock %}</title>
<script>{{ THEME_INIT_JS | safe }}</script>
<style>{{ THEME_CSS | safe }}</style>
<link rel="stylesheet" href="{{ root }}/static/style.css">
</head>
<body>
<main class="{% block main_class %}{% endblock %}">
{% block toolbar %}
<div class="toolbar">
  <nav>
    {% for href, label in NAV %}<a href="{{ root }}{{ href }}"{% if path == root ~ href %} class="active"{% endif %}>{{ label }}</a>{% endfor %}
    {% if auth_enabled %}<form method="post" action="{{ root }}/logout"><button type="submit">Abmelden</button></form>{% endif %}
  </nav>
  Darstellung {{ THEME_SWITCH_HTML | safe }}
</div>
{% endblock %}
{% for kind, message in flashes %}<div class="flash {{ kind }}">{{ message }}</div>{% endfor %}
{% block content %}{% endblock %}
</main>
<script>{{ THEME_SWITCH_JS | safe }}</script>
{% block scripts %}{% endblock %}
</body>
</html>
