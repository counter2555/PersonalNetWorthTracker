{% extends "base.html" %}
{% block title %}Anmelden · Net Worth{% endblock %}
{% block toolbar %}{% endblock %}
{% block content %}
<div class="card login">
  <h1>Net Worth</h1>
  {% if error %}<p class="error-text">{{ error }}</p>{% endif %}
  <form method="post" action="{{ root }}/login" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Benutzername <input name="username" autocomplete="username" autocapitalize="none" required autofocus></label>
    <label>Passwort <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="primary">Anmelden</button>
  </form>
  {% if registration %}<p class="hint">Noch kein Konto? <a href="{{ root }}/register">Registrieren</a></p>{% endif %}
</div>
{% endblock %}
