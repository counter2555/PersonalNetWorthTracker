services:
  networth:
    build: .
    # on the server: NWT_IMAGE=homeserver.lan:5000/networth:latest in .env (image pushed by build.sh)
    image: ${NWT_IMAGE:-networth:latest}
    container_name: networth
    restart: unless-stopped
    ports:
      - "${NWT_PORT:-8000}:8000"
    env_file: .env
    # the mounted folder must be writable for this user (default 1000:1000)
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      # local folder with the database (networth.sqlite) and the session key
      - ${NWT_HOST_DATA_DIR:-./data}:/data
